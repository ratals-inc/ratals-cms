; ############################################################
; FRONTEND AUTO PREPEND (NGINX / PHP-FPM ONLY)
; ############################################################
;
; IMPORTANT:
; This file is ONLY used on servers running Nginx with PHP-FPM.
; Apache and LiteSpeed servers IGNORE this file.
;
; If you are using Apache or LiteSpeed:
; - This file does NOTHING
; - The equivalent behavior is handled in /.htaccess using:
;   php_value auto_prepend_file
;
; ############################################################
; WHAT THIS DOES
; ############################################################
;
; This automatically includes the frontend session check file
; BEFORE every PHP file on the site runs.
;
; It is equivalent to adding this at the top of every PHP file:
;
; require_once($_SERVER['DOCUMENT_ROOT'].'/core/session-check-frontend.php');
;
; This ensures:
; - Sessions are always started correctly
; - Frontend security logic is always enforced
; - Developers CANNOT forget to include it
;
; ############################################################
; REQUIRED SETUP (VERY IMPORTANT)
; ############################################################
;
; You MUST replace the path below with your FULL SERVER PATH.
;
; IMPORTANT:
; You must also update the path in:
;   /admin/.user.ini
; BOTH files must be updated for the system to work correctly.
;
; Example:
; /home/yourusername/public_html/core/session-check-frontend.php
;
; DO NOT use relative paths like:
; ../core/session-check-frontend.php  (this will NOT work)
;
; ############################################################


;auto_prepend_file = "/home/yourusername/public_html/core/session-check-frontend.php"


; ############################################################
; NOTES
; ############################################################
;
; - Changes to this file may take up to 5 minutes to apply
;   due to PHP caching (user_ini.cache_ttl).
;
; - To apply changes instantly, restart PHP-FPM if you have access.
;
; ############################################################