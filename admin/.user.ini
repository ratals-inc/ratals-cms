; ############################################################
; ADMIN AUTO PREPEND (NGINX / PHP-FPM ONLY)
; ############################################################
;
; IMPORTANT:
; This file is ONLY used on servers running Nginx with PHP-FPM.
; Apache and LiteSpeed servers IGNORE this file.
;
; If you are using Apache or LiteSpeed:
; - This file does NOTHING
; - The equivalent behavior is handled in /admin/.htaccess using:
;   php_value auto_prepend_file
;
; ############################################################
; WHAT THIS DOES
; ############################################################
;
; This automatically includes the admin session check file
; BEFORE every PHP file in the /admin directory runs.
;
; It is equivalent to adding this at the top of every admin PHP file:
;
; require_once($_SERVER['DOCUMENT_ROOT'].'/core/session-check-admin.php');
;
; This ensures:
; - Admin authentication is ALWAYS enforced
; - Unauthorized users are blocked (403 Forbidden)
; - The hidden admin directory is protected
; - Developers CANNOT accidentally expose admin files
;
; ############################################################
; REQUIRED SETUP (VERY IMPORTANT)
; ############################################################
;
; You MUST replace the path below with your FULL SERVER PATH.
;
; IMPORTANT:
; You must also update the path in:
;   /.user.ini
; BOTH files must be updated for the system to work correctly.
;
; Example:
; /home/yourusername/public_html/core/session-check-admin.php
;
; DO NOT use relative paths like:
; ../core/session-check-admin.php  (this will NOT work)
;
; ############################################################


;auto_prepend_file = "/home/yourusername/public_html/core/session-check-admin.php"


; ############################################################
; PHP Limit Settings
; ############################################################
upload_max_filesize = 512M
post_max_size = 512M
max_file_uploads = 20
max_input_vars = 100000

; ############################################################
; NOTES
; ############################################################
;
; - Changes to this file may take up to 5 minutes to apply
;   due to PHP caching (user_ini.cache_ttl).
;
; - To apply changes instantly, restart PHP-FPM if you have access.
;
; ############################################################